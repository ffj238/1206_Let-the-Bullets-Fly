const ST={L:1,M:11,R:23},CN={L:10,M:12,R:10},SEC=['L','M','R'];

function mkGrid(host,click){
  const el={};
  ORDER.forEach(row=>{
    const rw=document.createElement('div');rw.className='rw'+('DI'.includes(row)?' gap':'');
    const lab=()=>{const d=document.createElement('div');d.className='lb';d.textContent=row+'排';return d};
    rw.append(lab());
    SEC.forEach((k,i)=>{
      if(i){const sp=document.createElement('div');sp.className='sep';rw.append(sp)}
      const b=document.createElement('div');b.className='blk';
      b.style.gridTemplateColumns=`repeat(${CN[k]},var(--s))`;
      b.style.width=`calc(${CN[k]} * var(--s) + ${(CN[k]-1)*3}px)`;
      ROWS[row][k].forEach(n=>{
        const id=row+'-'+n,e=document.createElement('button');
        e.className='seat';e.textContent=n;e.style.gridColumn=String(n-ST[k]+1);
        if(click)e.onclick=()=>click(id);else e.tabIndex=-1;
        el[id]=e;b.append(e);
      });
      rw.append(b);
    });
    rw.append(lab());host.append(rw);
  });
  return el;
}

/* ---------- 加密 ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const norm=(k,c)=>k.normalize('NFKC').trim().toLowerCase().replace(/\s+/g,'')+'|'+c.normalize('NFKC').replace(/\D/g,'');
async function derive(k,c){
  const base=await crypto.subtle.importKey('raw',enc.encode(norm(k,c)),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(SALT),iterations:ITER},base,384));
  return {id:hex(bits.slice(0,16)),key:await crypto.subtle.importKey('raw',bits.slice(16,48),'AES-GCM',false,['encrypt','decrypt'])};
}

/* ---------- 觀眾查詢 ---------- */
const elv=mkGrid($('vgrid'),null);
let TESTPUB=null,fail=0,lock=0;
const say=t=>{$('qr').textContent=t};
function fit(){const h=$('vc');if(h.hidden)return;const w=h.clientWidth-28;h.style.setProperty('--s',Math.max(14,Math.min(28,Math.floor((w-231)/32)))+'px')}
async function query(){
  const k=$('qk').value,c=$('qc').value.trim();
  if(!k.trim()||!/^\d{3}$/.test(c)){say('請輸入信箱，以及 3 位數字的末三碼');return}
  if(Date.now()<lock){say('嘗試次數過多，請稍後再試');return}
  const pub=TESTPUB||PUB;
  if(!Object.keys(pub.r).length){say('座位查詢尚未開放');return}
  $('qb').disabled=true;say('查詢中…');
  let d=null;
  try{
    const {id,key}=await derive(k,c),v=pub.r[id];
    if(v){try{const u=unb64(v);d=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12))))}catch(e){}}
  }catch(e){say('此瀏覽器不支援查詢功能');$('qb').disabled=false;return}
  $('qb').disabled=false;
  ALL.forEach(id=>elv[id].classList.remove('me'));
  if(!d){
    if(++fail>=5){lock=Date.now()+30000;fail=0}
    $('vc').hidden=true;say('查無資料，請確認輸入內容與報名時相同');return;
  }
  fail=0;
  d.s.forEach(id=>elv[id]&&elv[id].classList.add('me'));
  say(`${d.n} 坐在 ${d.s.map(fmt).join('、')}（共 ${d.s.length} 位）`);
  $('vc').hidden=false;fit();
  const f=elv[d.s[0]];if(f)f.scrollIntoView({inline:'center',block:'nearest'});
}
$('qb').onclick=query;
['qk','qc'].forEach(i=>$(i).onkeydown=e=>{if(e.key==='Enter')query()});
addEventListener('resize',fit);

/* ---------- 管理者劃位 ---------- */
const EK='cinema-admin-enc-v1',OLD='cinema-seat-planner-v1';let AK=null,ASALT=null;const blank=()=>({assign:{},names:[],meta:{},active:''});
let S=blank(),undo=[];

const ela=mkGrid($('grid'),clickSeat);
const color=n=>`hsl(${(S.names.indexOf(n)*67+160)%360} 55% 38%)`;
const seatsOf=n=>ALL.filter(id=>S.assign[id]===n);
function snap(){undo.push(JSON.stringify(S));if(undo.length>60)undo.shift()}
async function akey(pw,salt){const b=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:200000},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(){
  if(!AK)return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},AK,enc.encode(JSON.stringify(S))));
  const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);
  try{localStorage.setItem(EK,JSON.stringify({s:b64(ASALT),d:b64(all)}))}catch(e){}
}
function save(){clearTimeout(save.t);save.t=setTimeout(seal,150)}
function ensure(n){if(!S.names.includes(n)){S.names.push(n);S.meta[n]={k:$('ck').value.trim(),c:$('cc').value.trim()}}}
function clickSeat(id){
  const o=S.assign[id];
  if(o){if(o===S.active){snap();delete S.assign[id]}else S.active=o}
  else{
    if(!S.active){toast('請先輸入或選擇姓名');return}
    snap();ensure(S.active);S.assign[id]=S.active;
  }
  render();
}
function render(){
  ALL.forEach(id=>{
    const e=ela[id],o=S.assign[id];
    e.classList.toggle('on',!!o);e.classList.toggle('mine',!!o&&o===S.active);
    e.style.background=o?color(o):'';e.title=o?`${fmt(id)}：${o}`:fmt(id);
  });
  const u=ALL.filter(id=>S.assign[id]).length;
  $('tot').textContent=ALL.length;$('used').textContent=u;$('left').textContent=ALL.length-u;
  $('nm').value=S.active;const m=S.meta[S.active]||{k:'',c:''};$('ck').value=m.k;$('cc').value=m.c;
  const box=$('names');box.innerHTML='';
  S.names.forEach(n=>{
    const ss=seatsOf(n),mm=S.meta[n]||{},d=document.createElement('div');d.className='nm'+(n===S.active?' act':'');
    const dot=document.createElement('span');dot.className='dot';dot.style.background=color(n);
    const t=document.createElement('div');t.className='n';t.append(document.createTextNode(`${n}（${ss.length}）`));
    const sm=document.createElement('small');
    sm.textContent=(!mm.k||!/^\d{3}$/.test(mm.c||'')?'⚠ 缺查詢資料　':'')+(ss.map(fmt).join('、')||'尚未劃位');t.append(sm);
    const x=document.createElement('button');x.className='x';x.textContent='✕';x.title='刪除此人並釋出座位';
    x.onclick=ev=>{ev.stopPropagation();snap();ss.forEach(i=>delete S.assign[i]);S.names=S.names.filter(q=>q!==n);delete S.meta[n];if(S.active===n)S.active='';render()};
    d.onclick=()=>{S.active=n;render()};
    d.append(dot,t,x);box.append(d);
  });
  save();
}
$('nm').oninput=e=>{S.active=e.target.value.trim();const m=S.meta[S.active];$('ck').value=m?m.k:'';$('cc').value=m?m.c:'';
  document.querySelectorAll('.nm').forEach(x=>x.classList.remove('act'));
  ALL.forEach(id=>ela[id].classList.toggle('mine',!!S.assign[id]&&S.assign[id]===S.active))};
const upMeta=()=>{const m=S.meta[S.active];if(m){m.k=$('ck').value.trim();m.c=$('cc').value.trim();save()}};
$('ck').oninput=upMeta;$('cc').oninput=()=>{$('cc').value=$('cc').value.replace(/\D/g,'');upMeta()};
function addName(){const n=$('nm').value.trim();if(!n)return;S.active=n;snap();ensure(n);render()}
$('add').onclick=addName;$('nm').onkeydown=e=>{if(e.key==='Enter')addName()};
$('undo').onclick=()=>{if(!undo.length){toast('沒有可復原的動作');return}S=JSON.parse(undo.pop());render()};
let rt;$('reset').onclick=function(){
  if(this.dataset.c){snap();S={assign:{},names:[],meta:{},active:''};render();this.textContent='全部清空';delete this.dataset.c;clearTimeout(rt);return}
  this.dataset.c=1;this.textContent='再按一次確認';rt=setTimeout(()=>{this.textContent='全部清空';delete this.dataset.c},3000)};
$('exp').onclick=()=>{$('out').value=S.names.map(n=>{const ss=seatsOf(n);return `${n}\t${ss.length}\t${ss.map(fmt).join('、')}`}).join('\n')};
$('bk').onclick=()=>{$('out').value=JSON.stringify(S);toast('備份含個資，請妥善保管')};
$('rs').onclick=()=>{try{const d=JSON.parse($('out').value);if(!d.assign||!d.names)throw 0;snap();S=Object.assign({assign:{},names:[],meta:{},active:''},d);render();toast('已還原')}catch(e){toast('請先把備份內容貼到文字區')}};
$('copy').onclick=async()=>{const o=$('out');
  try{await navigator.clipboard.writeText(o.value);toast('已複製')}catch(e){o.select();try{document.execCommand('copy');toast('已複製')}catch(_){toast('請手動選取文字複製')}}};
$('gen').onclick=async()=>{
  const bad=[],rec={},seen={},list=S.names.filter(n=>seatsOf(n).length);
  $('gen').disabled=true;$('msg').textContent='';
  try{
    let i=0;
    for(const n of list){
      $('out').value=`產生中… ${++i}/${list.length}`;
      const m=S.meta[n]||{},ss=seatsOf(n);
      if(!m.k||!/^\d{3}$/.test(m.c||'')){bad.push(n+'（缺信箱或末三碼）');continue}
      const {id,key}=await derive(m.k,m.c);
      if(rec[id]){bad.push(n+'（與「'+seen[id]+'」的查詢資料重複）');continue}
      seen[id]=n;
      const iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify({n,s:ss}))));
      const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);rec[id]=b64(all);
    }
    const pub={v:1,r:rec};TESTPUB=pub;$('out').value=JSON.stringify(pub);
    $('msg').textContent=`已加密 ${Object.keys(rec).length} 人。可回到觀眾查詢頁試查（僅限此次開啟）。`+(bad.length?` 未納入：${bad.join('、')}`:'');
  }catch(e){$('out').value='';$('msg').textContent='此瀏覽器不支援加密功能'}
  $('gen').disabled=false;
};

/* ---------- 路由 ---------- */
const gm=t=>{$('gm').textContent=t};
function showGate(){let first=true;try{first=!localStorage.getItem(EK)}catch(e){}$('pw2').hidden=!first;$('gt').textContent=first?'首次使用：請設定管理密碼（至少 6 個字元）。此瀏覽器內的劃位資料會以此密碼加密，忘記密碼就無法解開，請另外備份。':'請輸入管理密碼。';gm('')}
async function unlock(){
  const pw=$('pw').value;if(!pw)return;
  let st=null;try{st=JSON.parse(localStorage.getItem(EK)||'null')}catch(e){}
  $('gb').disabled=true;gm('驗證中…');
  try{
    if(st){
      const salt=unb64(st.s),k=await akey(pw,salt),u=unb64(st.d);
      try{S=Object.assign(blank(),JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12)))))}catch(e){gm('密碼錯誤');return}
      AK=k;ASALT=salt;
    }else{
      if(pw.length<6){gm('密碼至少 6 個字元');return}
      if($('pw2').value!==pw){gm('兩次輸入的密碼不一致');return}
      ASALT=crypto.getRandomValues(new Uint8Array(16));AK=await akey(pw,ASALT);
      let old=null;try{old=JSON.parse(localStorage.getItem(OLD)||'null')}catch(e){}
      S=Object.assign(blank(),old&&old.assign?old:{});
      await seal();try{localStorage.removeItem(OLD)}catch(e){}
    }
    $('pw').value='';$('pw2').value='';gm('');route();
  }catch(e){gm('此瀏覽器不支援加密功能')}
  finally{$('gb').disabled=false}
}
$('gb').onclick=unlock;['pw','pw2'].forEach(i=>$(i).onkeydown=e=>{if(e.key==='Enter')unlock()});
$('lk').onclick=async()=>{clearTimeout(save.t);await seal();AK=null;ASALT=null;S=blank();undo=[];TESTPUB=null;$('out').value='';location.hash='';route()};
function route(){const a=location.hash==='#admin';$('vu').hidden=a;$('ad').hidden=!(a&&AK);$('gate').hidden=!(a&&!AK);if(a&&AK)render();else if(a)showGate();else fit()}
addEventListener('hashchange',route);route();
</script></body></html>
